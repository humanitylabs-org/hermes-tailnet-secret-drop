name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ruff
      - run: python -m py_compile src/secret_drop.py scripts/install.py scripts/uninstall.py scripts/privacy-check.py
      - run: python -m unittest discover -s tests -v
      - run: python -m ruff check .
      - run: bash -n scripts/prereq-check.sh scripts/setup.sh
      - run: python scripts/privacy-check.py
